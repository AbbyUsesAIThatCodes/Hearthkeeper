[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthkeeper"
version = "0.1.0a1"
description = "A local archive desk and development toolkit for a personal Azeroth"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL[rsa]==1.2.0"]

[project.scripts]
hearthkeeper = "hearthkeeper.cli:main"

[tool.setuptools.packages.find]
include = ["hearthkeeper*"]

[tool.setuptools.package-data]
hearthkeeper = ["assets/*", "data/*.json"]
