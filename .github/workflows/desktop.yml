name: Native desktop
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[desktop]" pyinstaller==6.16.0
      - name: Exercise native widgets and all six themes from source
        run: python -X faulthandler -u -m hearthkeeper.six_worlds --smoke-test var/native-source
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the desktop executable
        run: python build_desktop.py
      - name: Exercise the packaged executable
        shell: pwsh
        run: |
          $taskApp = Start-Process -FilePath .\dist\Hearthkeeper\Hearthkeeper.exe -ArgumentList '--smoke-test', 'var/native-packaged' -PassThru -Wait
          if ($taskApp.ExitCode -ne 0) {
            if (Test-Path var/native-packaged/smoke-error.txt) { Get-Content var/native-packaged/smoke-error.txt }
            throw "Packaged desktop smoke test failed: $($taskApp.ExitCode)"
          }
          if (!(Test-Path var/native-packaged/result.json)) { throw 'The packaged app did not write its test result.' }
          if (!(Test-Path var/native-packaged/six-worlds-result.json)) { throw 'The packaged app did not test its six themes.' }
          if (!(Test-Path var/native-packaged/home-art-result.json)) { throw 'The packaged app did not test its painted Home.' }
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install an unsupported default Python to reproduce the launch report
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Select supported Python when the Windows default is 3.14
        shell: pwsh
        env:
          PY_PYTHON: '3.14'
          PY_PYTHON3: '3.14'
        run: |
          $taskDefault = & py -3 -c "import sys; print(str(sys.version_info.major) + '.' + str(sys.version_info.minor))"
          if ($LASTEXITCODE -ne 0 -or $taskDefault -ne '3.14') { throw 'Could not reproduce the unsupported default Python.' }
          $taskSelected = & cmd /d /c "Start-Hearthkeeper.bat --check-python"
          if ($LASTEXITCODE -ne 0) { throw 'The launcher failed with a compatible side-by-side Python installed.' }
          $taskDetails = $taskSelected | ConvertFrom-Json
          if ($taskDetails.version[0] -ne 3 -or $taskDetails.version[1] -ne 12) { throw 'The launcher did not select Python 3.12.' }
          Write-Output "Default Python was 3.14; the source launcher correctly selected 3.12."
      - uses: actions/upload-artifact@v4
        with:
          name: Hearthkeeper-0.1.0a8-Windows
          path: dist/Hearthkeeper/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-screenshots
          path: |
            var/native-source/*.png
            var/native-source/*.json
            var/native-source/*.txt
            var/native-packaged/*.png
            var/native-packaged/*.json
            var/native-packaged/smoke-error.txt
