name: Hearthkeeper checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m hearthkeeper demo
      - run: python -m hearthkeeper realm-plan
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-demo-screenshots
          path: var/screenshots/*.png
          retention-days: 7
  mysql-fixture:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fictional-root-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfictional-root-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[mysql]"
      - run: python tests/mysql_smoke.py
        env:
          HEARTHKEEPER_DISPOSABLE_MYSQL: '1'
          HEARTHKEEPER_CI_MYSQL_PASSWORD: fictional-root-ci-only
